<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>规则卡 · 一句话算票</title>
  <style>
    :root {
      --ink:#141c2b; --muted:#667085; --line:#e6eaf0; --blue:#0b5fff; --bg:#eef2f6;
      --ok:#0f766e; --bad:#b42318; --paper:#fff; --soft:#f5f8fc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: radial-gradient(900px 420px at 8% -8%, #d9e7ff 0%, transparent 55%), var(--bg);
    }
    .wrap { max-width: 980px; margin: 0 auto; padding: 24px 20px 48px; }
    .eyebrow { color: var(--blue); font-size: 13px; font-weight: 600; }
    h1 { margin: 6px 0 0; font-size: 28px; letter-spacing: -0.02em; }
    .lead { color: var(--muted); margin: 8px 0 18px; line-height: 1.5; }
    .chat {
      background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 14px;
      box-shadow: 0 10px 30px rgba(20,28,43,.04); margin-bottom: 14px;
    }
    .log { display: grid; gap: 10px; max-height: 220px; overflow: auto; padding: 4px; margin-bottom: 10px; }
    .bubble { max-width: 92%; padding: 10px 12px; border-radius: 14px; font-size: 14px; line-height: 1.45; }
    .bubble.bot { background: var(--soft); border: 1px solid var(--line); }
    .bubble.user { background: #e8f0ff; border: 1px solid #c9daff; margin-left: auto; }
    .composer { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    .composer input {
      border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font: inherit;
    }
    .composer button, .cta {
      border: 0; border-radius: 12px; padding: 12px 16px; background: linear-gradient(135deg,#0b5fff,#0a4ed1);
      color: #fff; font: inherit; font-weight: 650; cursor: pointer;
    }
    .hints { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .hint {
      border: 1px solid var(--line); background: var(--soft); border-radius: 999px;
      padding: 6px 12px; font-size: 13px; cursor: pointer;
    }
    .grid { display: grid; grid-template-columns: 1.05fr .95fr; gap: 14px; }
    @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } h1 { font-size: 22px; } }
    .panel {
      background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 16px;
      box-shadow: 0 10px 30px rgba(20,28,43,.04);
    }
    h2 { margin: 0 0 10px; font-size: 16px; }
    label { display:block; font-size:12px; color: var(--muted); margin: 0 0 6px; }
    select, textarea, input[type=number] {
      width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit;
    }
    .chips { display:flex; flex-wrap:wrap; gap:8px; margin: 8px 0; }
    .chip {
      border: 1px solid var(--line); background: var(--soft); border-radius: 999px;
      padding: 7px 12px; font: inherit; font-size: 13px; cursor: pointer;
    }
    .chip.primary { background:#e8f0ff; border-color:#c9daff; color:var(--blue); font-weight:600; }
    .people { display:grid; gap:8px; }
    .person { border:1px solid var(--line); border-radius:12px; padding:10px; background:var(--soft); }
    .person-top { display:flex; justify-content:space-between; align-items:center; }
    .person-grid { display:grid; grid-template-columns:1fr 1.2fr auto; gap:8px; align-items:end; margin-top:8px; }
    .remove { border:0; background:transparent; color:var(--bad); cursor:pointer; font-size:13px; }
    .check { display:flex; gap:6px; align-items:center; font-size:13px; color:var(--muted); padding-bottom:6px; }
    details.terms { margin-top:12px; border:1px dashed #d5dbe5; border-radius:12px; padding:10px 12px; }
    details.terms summary { cursor:pointer; color:var(--muted); font-size:13px; }
    .summary {
      border-radius:14px; padding:14px 16px; background:linear-gradient(135deg,#102a56,#1a3f86); color:#fff; margin-bottom:12px;
    }
    .summary .big { font-size:20px; font-weight:700; margin-top:4px; }
    .summary .sub { opacity:.88; font-size:13px; margin-top:6px; }
    .result-list { display:grid; gap:8px; margin-bottom:12px; }
    .result { border:1px solid var(--line); border-radius:12px; padding:12px; display:grid; grid-template-columns:1fr auto; gap:4px; }
    .ticket-tag { font-weight:700; color:var(--blue); font-size:18px; }
    .ticket-tag.bad { color: var(--bad); }
    .meta { color:var(--muted); font-size:12px; grid-column:1/-1; }
    .cells { display:grid; gap:8px; }
    .cell { border:1px solid var(--line); border-radius:12px; padding:12px; }
    .ok { background:#f2fbf8; border-color:#c7e8df; }
    .bad { background:#fff5f3; border-color:#f0c7c1; }
    .muted { color:var(--muted); font-size:12px; margin-top:6px; }
    .warn { font-size:12px; color:var(--muted); }
    .blockers { display:grid; gap:6px; margin-bottom:10px; }
    .blocker { background:#fff5f3; border:1px solid #f0c7c1; color:var(--bad); border-radius:10px; padding:8px 10px; font-size:13px; }
    .source { font-size:12px; color:var(--muted); margin-top:6px; word-break:break-all; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">预订前 · 规则卡</div>
    <h1>一句话带上家人，算清楚怎么买</h1>
    <p class="lead">先说话，再微调。条款自动带入，不用复制粘贴。结论仍由规则编译执行，不是聊天随口说。</p>

    <section class="chat">
      <div class="log" id="log"></div>
      <div class="composer">
        <input id="chatInput" placeholder="例如：带孩子去科技馆，能不能免票？" />
        <button type="button" id="chatSend">发送</button>
      </div>
      <div class="hints">
        <button type="button" class="hint" data-q="带孩子去科技馆，能不能免票？">带孩子去科技馆</button>
        <button type="button" class="hint" data-q="一家三口去东方明珠">一家三口去东方明珠</button>
        <button type="button" class="hint" data-q="亲子去故宫">亲子去故宫</button>
        <button type="button" class="hint" data-q="两个孩子去国博，只有大人吗？不，就孩子">国博只有孩子？</button>
      </div>
    </section>

    <div class="grid">
      <section class="panel">
        <h2>行程（可改，一般不用手打）</h2>
        <label>景区</label>
        <select id="venue"></select>
        <p class="source" id="source"></p>
        <div class="chips">
          <button type="button" class="chip primary" data-preset="parent-child">亲子二人</button>
          <button type="button" class="chip primary" data-preset="family3">一家三口</button>
          <button type="button" class="chip" data-add="adult">+ 成人</button>
          <button type="button" class="chip" data-add="child">+ 儿童</button>
          <button type="button" class="chip" data-add="toddler">+ 幼童</button>
        </div>
        <div class="people" id="people"></div>
        <details class="terms">
          <summary>条款与种草（自动带入，核对时再展开）</summary>
          <label style="margin-top:10px">种草说法</label>
          <textarea id="promo"></textarea>
          <label>票务页原文</label>
          <textarea id="page" style="min-height:110px"></textarea>
        </details>
        <button class="cta" id="run" type="button" style="width:100%;margin-top:12px">按当前出行人重算</button>
      </section>

      <section class="panel">
        <h2>订前结论</h2>
        <div class="summary" id="summary">
          <div>本单</div>
          <div class="big">先在上面说一句，或点快捷提示</div>
          <div class="sub">例如「带孩子去科技馆」</div>
        </div>
        <div class="blockers" id="blockers"></div>
        <div class="result-list" id="results"></div>
        <div class="cells" id="cells"></div>
      </section>
    </div>
  </div>

  <script src="./venues.js"></script>
  <script src="./rulecard_browser.js"></script>
  <script>
    const venues = window.RULECARD_VENUES || [];
    const venueEl = document.querySelector("#venue");
    const promoEl = document.querySelector("#promo");
    const pageEl = document.querySelector("#page");
    const sourceEl = document.querySelector("#source");
    const peopleEl = document.querySelector("#people");
    const logEl = document.querySelector("#log");
    const chatInput = document.querySelector("#chatInput");
    let people = [];
    let personSeq = 1;
    let originalPage = "";

    const PRESETS = {
      adult: { role: "成人", age: 35, height_m: 1.7 },
      child: { role: "儿童", age: 7, height_m: 1.3 },
      toddler: { role: "幼童", age: 5, height_m: 1.1 },
    };

    function pushBubble(role, text) {
      const div = document.createElement("div");
      div.className = "bubble " + role;
      div.textContent = text;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function currentVenue() { return venues.find((v) => v.id === venueEl.value); }

    function renumber() {
      const counts = {};
      for (const p of people) {
        counts[p.role] = (counts[p.role] || 0) + 1;
        p.name = p.role + counts[p.role];
      }
    }

    function addPerson(kind) {
      const base = PRESETS[kind] || PRESETS.child;
      people.push({ id: "p" + personSeq++, role: base.role, name: base.role, age: base.age, height_m: base.height_m, student: false });
      renumber();
      renderPeople();
    }

    function setPeopleFromTravelers(travelers) {
      people = (travelers || []).map((t, i) => ({
        id: t.id || "p" + (i + 1),
        role: (t.name || "出行人").replace(/\d+$/, "") || "出行人",
        name: t.name || "出行人" + (i + 1),
        age: t.age,
        height_m: t.height_m,
        student: false,
      }));
      personSeq = people.length + 1;
      renderPeople();
    }

    function setFamily(preset) {
      people = [];
      personSeq = 1;
      if (preset === "family3") { addPerson("adult"); addPerson("child"); addPerson("toddler"); }
      else { addPerson("adult"); addPerson("child"); }
    }

    function renderPeople() {
      if (!people.length) {
        peopleEl.innerHTML = `<p class="warn">还没有出行人。说一句「带孩子去科技馆」或点亲子二人。</p>`;
        return;
      }
      peopleEl.innerHTML = people.map((p) => `
        <div class="person">
          <div class="person-top"><strong>${p.name}</strong><button class="remove" data-remove="${p.id}" type="button">移除</button></div>
          <div class="person-grid">
            <div><label>年龄</label><input type="number" min="0" max="80" value="${p.age}" data-id="${p.id}" data-field="age" /></div>
            <div><label>身高 ${Number(p.height_m).toFixed(2)} 米</label><input type="range" min="0.8" max="1.9" step="0.01" value="${p.height_m}" data-id="${p.id}" data-field="height_m" /></div>
            <label class="check"><input type="checkbox" data-id="${p.id}" data-field="student" ${p.student ? "checked" : ""} />学生</label>
          </div>
        </div>`).join("");
    }

    function fillVenue() {
      const venue = currentVenue();
      if (!venue) return;
      promoEl.value = venue.promo_text;
      pageEl.value = venue.page_text;
      originalPage = venue.page_text;
      sourceEl.textContent = `${venue.city} · ${venue.verified ? "已核对" : "例句"} · ${venue.source || ""}`;
    }

    function runOrder(botNote) {
      const base = currentVenue();
      if (!base || !people.length) return;
      const edited = pageEl.value !== originalPage;
      const venue = { ...base, promo_text: promoEl.value, page_text: pageEl.value, gold: edited ? null : base.gold };
      const card = RuleCardBrowser.buildOrderCard(venue, people);
      document.querySelector("#summary").innerHTML = `
        <div>${card.name} · ${card.summary.n} 人</div>
        <div class="big">${card.summary_text}</div>
        <div class="sub">${card.can_book ? "按当前规则，可以继续走向预订。" : "有阻断项，建议先处理再下单。"} ${card.release}</div>`;
      document.querySelector("#blockers").innerHTML = (card.blockers || []).map((b) =>
        `<div class="blocker">${b.message}</div>`
      ).join("");
      document.querySelector("#results").innerHTML = card.per_person.map((row) => `
        <div class="result">
          <div>${row.name} · ${row.age}岁 · ${Number(row.height_m).toFixed(2)}米</div>
          <div class="ticket-tag ${row.promo_conflict ? "bad" : ""}">${row.ticket_label}</div>
          <div class="meta">${row.clause || ""}${row.promo_conflict ? " · 种草可能在说免票" : ""}</div>
        </div>`).join("");
      document.querySelector("#cells").innerHTML = `
        <div class="cell ${card.promo_conflict_any ? "bad" : "ok"}"><b>种草靠不靠谱</b>${card.promo_conflict_any ? "有人被种草说成免票，但条款不是" : "没有明显种草冲突"}</div>
        <div class="cell"><b>放票</b>${card.release}</div>
        <div class="cell ${card.can_book ? "ok" : "bad"}"><b>能否点预订</b>${card.can_book ? "未发现硬阻断" : "存在陪同/限额等阻断"}</div>`;
      if (botNote) pushBubble("bot", botNote + " → " + card.summary_text + (card.blockers[0] ? "。" + card.blockers[0].message : "。"));
    }

    function handleChat(text) {
      const q = String(text || "").trim();
      if (!q) return;
      pushBubble("user", q);
      // 特殊：国博只有孩子
      let intentText = q;
      if (/国博/.test(q) && /只.*孩子|没有大人|就孩子/.test(q)) {
        intentText = "国博 孩子";
        const intent = RuleCardBrowser.parseIntent("去国博", venues);
        if (intent.venue_id) venueEl.value = intent.venue_id;
        fillVenue();
        setPeopleFromTravelers([{ id: "儿童1", name: "儿童1", age: 7, height_m: 1.3 }]);
        runOrder("只有孩子去国博时，我会检查是否必须成人代约");
        chatInput.value = "";
        return;
      }
      const intent = RuleCardBrowser.parseIntent(intentText, venues);
      pushBubble("bot", intent.reply);
      if (intent.venue_id) {
        venueEl.value = intent.venue_id;
        fillVenue();
      }
      if (intent.travelers && intent.travelers.length) setPeopleFromTravelers(intent.travelers);
      if (intent.venue_id) runOrder("已按会话生成订单结论");
      chatInput.value = "";
    }

    function load() {
      venueEl.innerHTML = venues.map((v) => `<option value="${v.id}">${v.split === "heldout" ? "［留出］" : ""}${v.name}</option>`).join("");
      const prefer = venues.find((v) => v.id === "tech-museum") || venues[0];
      if (prefer) venueEl.value = prefer.id;
      fillVenue();
      setFamily("parent-child");
      pushBubble("bot", "你好。直接说「带孩子去科技馆」或点下面快捷句，我帮你算每个人什么票。");
      runOrder();
    }

    document.querySelector("#chatSend").addEventListener("click", () => handleChat(chatInput.value));
    chatInput.addEventListener("keydown", (e) => { if (e.key === "Enter") handleChat(chatInput.value); });
    document.querySelectorAll(".hint").forEach((btn) => btn.addEventListener("click", () => handleChat(btn.getAttribute("data-q"))));
    venueEl.addEventListener("change", () => { fillVenue(); runOrder(); });
    document.querySelectorAll("[data-preset]").forEach((btn) => btn.addEventListener("click", () => { setFamily(btn.getAttribute("data-preset")); runOrder(); }));
    document.querySelectorAll("[data-add]").forEach((btn) => btn.addEventListener("click", () => { addPerson(btn.getAttribute("data-add")); runOrder(); }));
    peopleEl.addEventListener("click", (e) => {
      const id = e.target.getAttribute("data-remove");
      if (!id) return;
      people = people.filter((p) => p.id !== id);
      renumber();
      renderPeople();
      runOrder();
    });
    peopleEl.addEventListener("input", (e) => {
      const id = e.target.getAttribute("data-id");
      const field = e.target.getAttribute("data-field");
      const person = people.find((p) => p.id === id);
      if (!person || !field) return;
      if (field === "student") person.student = e.target.checked;
      else if (field === "age") person.age = Number(e.target.value);
      else if (field === "height_m") {
        person.height_m = Number(e.target.value);
        const lab = e.target.parentElement.querySelector("label");
        if (lab) lab.textContent = `身高 ${person.height_m.toFixed(2)} 米`;
      }
    });
    peopleEl.addEventListener("change", () => runOrder());
    document.querySelector("#run").addEventListener("click", () => runOrder());
    load();
  </script>
</body>
</html>
